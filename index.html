<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego 3 en raya</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-0">
  <div class="bg-black text-white border rounded p-3">
    <header class="text-center mb-3">
      <h1 class="h3">Juego 3 en raya</h1>
    </header>

    <main>
      <div class="row mb-3">
        <div class="col-12">
          <form>
            <div class="d-flex gap-2 mb-2">
              <img src="img/equis.png" alt="X" width="40" height="40">
              <input type="text" class="form-control" value="">
            </div>

            <div class="d-flex gap-2 mb-3">
              <img src="img/circulo.png" alt="O" width="40" height="40">
              <input type="text" class="form-control" value="">
            </div>

            <div class="text-center">
              <button type="button" class="btn p-0 border-0 bg-transparent">
                <img src="img/boton.png" alt="Iniciar Juego" width="190" height="400" class="img-fluid">
              </button>
            </div>
          </form>
        </div>
      </div>

      <div class="row text-center">
        <div class="col-12">
          <p class="mb-3">Turno: <output class="fw-bold"></output> </p>

          <table class="table table-bordered table-dark">
            <tbody>
              <tr>
                <td class="p-0"><img src="img/fondo.png" alt="1-1" class="w-100 d-block"></td>
                <td class="p-0"><img src="img/fondo.png" alt="1-2" class="w-100 d-block"></td>
                <td class="p-0"><img src="img/fondo.png" alt="1-3" class="w-100 d-block"></td>
              </tr>
              <tr>
                <td class="p-0"><img src="img/fondo.png" alt="2-1" class="w-100 d-block"></td>
                <td class="p-0"><img src="img/fondo.png" alt="2-2" class="w-100 d-block"></td>
                <td class="p-0"><img src="img/fondo.png" alt="2-3" class="w-100 d-block"></td>
              </tr>
              <tr>
                <td class="p-0"><img src="img/fondo.png" alt="3-1" class="w-100 d-block"></td>
                <td class="p-0"><img src="img/fondo.png" alt="3-2" class="w-100 d-block"></td>
                <td class="p-0"><img src="img/fondo.png" alt="3-3" class="w-100 d-block"></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
